---
name: Build and Release

"on":
  pull_request:
  push:
    branches:
      - master
      - main
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write

env:
  T9_DIR: t9
  ZIRAN: ${{ github.workspace }}/ziran/build/bin/ziran
  T9_BUILD_JOBS: 1
  LP_NUM_THREADS: 1
  OMP_NUM_THREADS: 1

jobs:
  linux-build:
    name: Linux build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out t9
        uses: actions/checkout@v4
        with:
          path: ${{ env.T9_DIR }}

      - name: Read locked toolchain
        id: toolchain
        working-directory: ${{ env.T9_DIR }}
        run: |
          python3 - <<'PY'
          import json
          import os
          with open("ziran.lock") as source:
              toolchain = json.load(source)["toolchain"]
          assert toolchain["url"] == "https://github.com/ziranlang/ziran.git"
          commit = toolchain["commit"]
          assert len(commit) == 40 and all(c in "0123456789abcdef" for c in commit)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"commit={commit}\n")
          PY

      - name: Check out locked Ziran
        uses: actions/checkout@v4
        with:
          repository: ziranlang/ziran
          ref: ${{ steps.toolchain.outputs.commit }}
          path: ziran

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            cmake \
            git \
            curl \
            desktop-file-utils \
            dpkg-dev \
            file \
            fonts-dejavu-core \
            libgl1-mesa-dev \
            libsdl2-dev \
            pkg-config \
            ripgrep \
            xauth \
            xdotool \
            x11-xserver-utils \
            xvfb

      - name: Build locked Ziran tools
        working-directory: ziran
        run: env -u DISPLAY -u WAYLAND_DISPLAY make -j2 JOBS=2 all

      - name: Build and test t9 from locked packages
        working-directory: ${{ env.T9_DIR }}
        run: |
          test ! -e ziran.local.toml
          env -u DISPLAY -u WAYLAND_DISPLAY -u XAUTHORITY \
            -u DBUS_SESSION_BUS_ADDRESS -u SESSION_MANAGER make -j1 all test

      - name: Package Linux release assets
        working-directory: ${{ env.T9_DIR }}
        run: |
          set -eu
          umask 022
          version="${GITHUB_REF_NAME:-${GITHUB_SHA}}"
          version="$(printf '%s' "${version}" | tr '/ :' '---')"
          deb_version="$(printf '%s' "${version}" | sed 's/^v//; s/[^A-Za-z0-9.+:~_-]/-/g')"
          case "${deb_version}" in
            [0-9]*) ;;
            *) deb_version="0.0.0+${deb_version}" ;;
          esac
          package="t9-linux-x86_64-${version}"
          mkdir -p "dist/${package}/bin"
          cp build/linux-x86_64/bin/t9 "dist/${package}/bin/t9"
          cp README.md "dist/${package}/README.md"
          cp docs/REMAINING_FEATURE_PLAN.md \
            "dist/${package}/REMAINING_FEATURE_PLAN.md"
          if [ -d benchmarks/results ]; then
            mkdir -p "dist/${package}/benchmarks"
            cp benchmarks/README.md "dist/${package}/benchmarks/README.md"
          fi
          tar -C dist -czf "dist/${package}.tar.gz" "${package}"

          deb_root="dist/deb/t9_${deb_version}_amd64"
          mkdir -p "${deb_root}/DEBIAN" \
            "${deb_root}/usr/bin" \
            "${deb_root}/usr/share/applications" \
            "${deb_root}/usr/share/doc/t9" \
            "${deb_root}/usr/share/icons/hicolor/scalable/apps"
          chmod 755 "${deb_root}/DEBIAN"
          cp build/linux-x86_64/bin/t9 "${deb_root}/usr/bin/t9"
          cp README.md "${deb_root}/usr/share/doc/t9/README.md"
          cp docs/site/favicon.svg \
            "${deb_root}/usr/share/icons/hicolor/scalable/apps/t9.svg"
          cat > "${deb_root}/usr/share/applications/t9.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Terminal
          Comment=Kryon terminal emulator
          Exec=t9
          Icon=t9
          Terminal=false
          Categories=System;TerminalEmulator;
          Keywords=shell;prompt;command;terminal;
          EOF
          cat > "${deb_root}/DEBIAN/control" <<EOF
          Package: t9
          Version: ${deb_version}
          Section: x11
          Priority: optional
          Architecture: amd64
          Maintainer: Waozi <waozi@proton.me>
          Depends: libc6, libsdl2-2.0-0, libgl1
          Recommends: fonts-dejavu-core
          Description: Kryon terminal emulator
           t9 is a standalone terminal application using Kryon for windowing,
           rendering, input, and platform integration.
          EOF
          chmod 644 "${deb_root}/DEBIAN/control"
          dpkg-deb --build --root-owner-group "${deb_root}" \
            "dist/t9_${deb_version}_amd64.deb"

          appdir="dist/AppDir"
          mkdir -p "${appdir}/usr/bin" \
            "${appdir}/usr/share/applications" \
            "${appdir}/usr/share/icons/hicolor/scalable/apps"
          cp build/linux-x86_64/bin/t9 "${appdir}/usr/bin/t9"
          cp docs/site/favicon.svg \
            "${appdir}/usr/share/icons/hicolor/scalable/apps/t9.svg"
          cp "${deb_root}/usr/share/applications/t9.desktop" \
            "${appdir}/usr/share/applications/t9.desktop"
          cp "${appdir}/usr/share/applications/t9.desktop" \
            "${appdir}/t9.desktop"
          cp "${appdir}/usr/share/icons/hicolor/scalable/apps/t9.svg" \
            "${appdir}/t9.svg"
          cat > "${appdir}/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          export PATH="${HERE}/usr/bin:${PATH}"
          exec "${HERE}/usr/bin/t9" "$@"
          EOF
          chmod +x "${appdir}/AppRun"
          curl -fL -o /tmp/appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          ARCH=x86_64 /tmp/appimagetool --appimage-extract-and-run \
            "${appdir}" "dist/t9-x86_64-${version}.AppImage"

          sha256sum "dist/${package}.tar.gz" \
            "dist/t9_${deb_version}_amd64.deb" \
            "dist/t9-x86_64-${version}.AppImage" > "dist/SHA256SUMS"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: t9-linux-x86_64
          path: |
            ${{ env.T9_DIR }}/dist/*.tar.gz
            ${{ env.T9_DIR }}/dist/*.deb
            ${{ env.T9_DIR }}/dist/*.AppImage
            ${{ env.T9_DIR }}/dist/SHA256SUMS

      - name: Upload release assets
        if: github.event_name == 'release'
        working-directory: ${{ env.T9_DIR }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >
          gh release upload "${RELEASE_TAG}"
          dist/*.tar.gz dist/*.deb dist/*.AppImage dist/SHA256SUMS --clobber
